name: Publish FastAPI Image
# Se ejecuta solo cuando el workflow "CI" termina en verde tras un push a main.
# Así los tests no se corren dos veces y nunca se publica un commit que falló.

on:
  workflow_run:
    workflows: [CI]          # debe coincidir con el "name:" de ci.yml
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write            # necesario para OIDC con AWS

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    # Solo si el CI pasó, fue por un push (no un PR) y viene de este mismo repo.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lab-env
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          # El commit exacto que pasó el CI (github.sha sería el último de main)
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable release image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: tecpsup/jose_armando
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f Dockerfile.prod \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            --build-arg SOURCE_URL="$SOURCE_URL" \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "Published $IMAGE_URI"
          echo "Imagen publicada: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
