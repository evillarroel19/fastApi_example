name: CD Ubuntu
# El servidor ejecuta Python + Uvicorn mediante systemd.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-ubuntu
  cancel-in-progress: false

jobs:
  deploy:
#    if: >-
#      github.event.workflow_run.conclusion == 'success' &&
#      github.event.workflow_run.event == 'push' &&
#      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lab-env
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          DISPLAY=:0 \
          SSH_ASKPASS="$HOME/.ssh/askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          ssh-add ~/.ssh/deploy_key < /dev/null

      - name: Subir el código
        shell: bash
        run: |
          set -euo pipefail

          rsync -az --delete \
            -e "ssh" \
            app/ "$SERVER_USER@$SERVER_HOST:/opt/users-api/app/"

          scp requirements.txt \
            "$SERVER_USER@$SERVER_HOST:/opt/users-api/requirements.txt"

      - name: Instalar y reiniciar
        shell: bash
        run: |
          set -euo pipefail

          ssh "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/users-api

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi

          .venv/bin/pip install -r requirements.txt
          sudo -n /usr/bin/systemctl restart users-api.service

          curl --fail --silent --show-error --retry 15 \
            --retry-delay 1 --retry-all-errors --max-time 2 \
            http://127.0.0.1:8000/health
          REMOTE

      - name: Limpiar credenciales temporales
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/askpass.sh
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k || true
          fi
